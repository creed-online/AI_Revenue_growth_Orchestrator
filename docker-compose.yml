version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argo-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - argo-network

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: argo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - argo-network

networks:
  argo-network:
    driver: bridge
